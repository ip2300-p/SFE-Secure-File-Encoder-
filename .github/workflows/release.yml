name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "شماره نسخه بدون v (مثلاً 1.1.0)"
        required: true
        default: "1.1.0"

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}

permissions:
  contents: write

jobs:
  # ─────────────── بیلد ویندوز ───────────────
  windows:
    name: Build Windows (WPF)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained
        run: dotnet publish windows/SFE.UI/SFE.UI.csproj -c Release -r win-x64 --self-contained true -o publish/win-x64

      - name: Ensure lang folder is present
        shell: pwsh
        run: |
          if (-not (Test-Path "publish/win-x64/lang")) {
            Copy-Item -Recurse "windows/SFE.UI/lang" "publish/win-x64/lang"
          }

      - name: Zip output
        shell: pwsh
        run: Compress-Archive -Path "publish/win-x64/*" -DestinationPath "SFE-Windows-${{ env.VERSION }}-win-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: SFE-Windows-*.zip

  # ─────────────── بیلد اندروید ───────────────
  android:
    name: Build Android (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets not set. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Signing secrets found."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: android
        run: flutter pub get

      - name: Prepare signing from secrets
        working-directory: android/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > sfe-release.keystore
          KS_PATH=$(pwd)/sfe-release.keystore
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KS_PATH" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > key.properties

      - name: Build release APK
        working-directory: android
        run: flutter build apk --release

      - name: Rename APK
        run: cp android/build/app/outputs/flutter-apk/app-release.apk "SFE-Android-${{ env.VERSION }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: SFE-Android-*.apk

  # ─────────────── ساخت Release ───────────────
  release:
    name: Create GitHub Release
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: SFE ${{ env.VERSION }}
          files: |
            artifacts/windows-build/SFE-Windows-*.zip
            artifacts/android-build/SFE-Android-*.apk
          body: |
            ## Download / دانلود
            | Platform | File |
            |---|---|
            | Windows 10/11 (x64) | `SFE-Windows-${{ env.VERSION }}-win-x64.zip` |
            | Android 6.0+ | `SFE-Android-${{ env.VERSION }}.apk` |
            **Windows:** زیپ را استخراج کنید و `SFE.UI.exe` را اجرا کنید (نیازی به نصب .NET نیست).
            **Android:** فایل APK را نصب کنید.
            > Built automatically by GitHub Actions.
